<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dojo Kanban</title>
    <meta name="description" content="Tablero Kanban — Zero Dependencies, Web APIs nativas" />

    <!-- Favicon -->
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />

    <!-- PWA — manifest y tema (US-31) -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DojoKanban" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />

    <!--
      Sistema de Design Tokens en 3 capas (US-43 / IMP-12):
        1. primitives.css — escala de valores brutos (colores, tipografía, espaciado).
        2. semantic.css   — tokens de rol que referencian primitivos; incluye light/dark.
        3. components.css — overrides por componente.
      Cada Web Component usa únicamente variables --dojo-* o --{componente}-*.
    -->
    <link rel="stylesheet" href="./styles/tokens/primitives.css" />
    <link rel="stylesheet" href="./styles/tokens/semantic.css" />
    <link rel="stylesheet" href="./styles/tokens/components.css" />

    <style>
      /* ── Reset mínimo ─────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--dojo-bg);
        color: var(--dojo-text-primary);
        min-height: 100dvh;
      }
    </style>

    <!--
      Script anti-FOUC: aplica el tema correcto ANTES de que el body se renderice.
      Evita el "flash" de fondo blanco cuando el usuario tiene modo oscuro.
    -->
    <script>
      (function() {
        var VALID = ['light', 'dark', 'system'];
        var pref = localStorage.getItem('theme-preference');
        if (!pref || VALID.indexOf(pref) === -1) pref = 'system';
        var theme = pref;
        if (pref === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <!-- El componente raíz de la aplicación se registra en main.ts -->
    <dojo-app></dojo-app>

    <!--
      type="module" garantiza:
        1. ES Modules nativos (import/export).
        2. Defer automático (no bloquea el parsing del HTML).
        3. Ejecución en strict mode por defecto.
    -->
    <script type="module" src="./main.js"></script>

    <!--
      Registro del Service Worker — PWA (US-31).
      Se registra tras el evento 'load' para no bloquear el render inicial.
      El SW vive en el scope raíz ('./' ) para interceptar todas las peticiones.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            console.info('[PWA] Service Worker registered. Scope:', reg.scope);
          }).catch(function (err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
